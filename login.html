<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | AgriDron Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="logo-mark" aria-hidden="true">
            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>
            <span class="center-dot"></span>
          </div>
          <div class="brand-text">
            <span class="brand-name">AgriDron</span>
            <span class="brand-sub">Solutions</span>
          </div>
        </div>

        <h1>Inicia sesión</h1>
        <p>Accede a tu panel para gestionar tus operaciones.</p>

        <form class="auth-form" novalidate>
          <div class="auth-field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" aria-invalid="false" aria-describedby="email-error" />
            <span id="email-error" class="field-error" aria-live="polite"></span>
          </div>

          <div class="auth-field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" />
          </div>

          <div class="auth-row">
            <label>
              <input type="checkbox" />
              Recordarme
            </label>
            <a href="#" class="auth-link">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="auth-button">Entrar</button>
        </form>

        <div class="auth-footer">
          ¿No tienes cuenta? <a href="registro.html">Solicita una demo</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.querySelector('.auth-form');
      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('email-error');

      function validateEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const emailValue = emailInput.value;
        const isValid = validateEmail(emailValue);

        if (!isValid) {
          emailInput.setAttribute('aria-invalid', 'true');
          emailInput.classList.add('input-error');
          emailError.textContent = 'Introduce un correo electrónico válido.';
          emailInput.focus();
          return;
        }

        emailInput.setAttribute('aria-invalid', 'false');
        emailInput.classList.remove('input-error');
        emailError.textContent = '';
      });

      emailInput.addEventListener('input', function () {
        if (this.value.trim() === '') {
          this.setAttribute('aria-invalid', 'false');
          this.classList.remove('input-error');
          emailError.textContent = '';
          return;
        }

        if (validateEmail(this.value)) {
          this.setAttribute('aria-invalid', 'false');
          this.classList.remove('input-error');
          emailError.textContent = '';
        }
      });
    </script>
  </body>
</html>
