<main class="hero">
  <div class="hero-copy">
    <h1>
      {{ 'hero.title' | translate }}
    </h1>

    <p>
      {{ 'hero.description' | translate }}
    </p>

    <div class="benefits" aria-label="Beneficios">
      <div class="benefit-item">
              <span class="icon cost-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img" aria-label="Reduce costos">
                  <path d="M16 7.5v11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <path d="M11.5 19l4.5 4.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M9.5 12.5c0-2.9 2.8-5.2 6.5-5.2s6.5 2.3 6.5 5.2-2.8 5.2-6.5 5.2c-3.7 0-6.5-2.3-6.5-5.2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
        <span>{{ 'hero.ReducesCosts' | translate }}</span>
      </div>
      <div class="benefit-item">
              <span class="icon productivity-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img" aria-label="Aumenta tu productividad">
                  <path d="M7 23.5h18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                  <path d="M9.5 18.5 14 14l4 4.5 6.5-8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M20.5 10h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
        <span>{{ 'hero.IncreaseProductivity' | translate }}</span>
      </div>
      <div class="benefit-item">
              <span class="icon shield-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img" aria-label="Protege a tu equipo">
                  <path d="M16 5.5 24 8.7v7.1c0 5.1-3.3 9.7-8 12.4-4.7-2.7-8-7.3-8-12.4V8.7l8-3.2Z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
                  <path d="M12.2 16.3 15 19.2l4.8-5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
        <span>{{ 'hero.ProtectTeam' | translate }}</span>
      </div>
    </div>

    <div class="cta-row">
      <button class="primary-cta">{{ 'hero.StartYour' | translate }} <span>→</span></button>
      <button class="secondary-cta">
        <span class="play-icon"></span>
        {{ 'hero.howItWorks' | translate }}
      </button>
    </div>
    </div>

  <div class="scene" aria-label="Mockup de la aplicación AgriDron en un celular">
    <div class="scene-placeholder">
      <img
        src="assets/images/hero/mockup_celular_agridron.png"
        alt="Mockup de la aplicación AgriDron en un celular"
      />
    </div>
  </div>
</main>
