<div class="language-switch" role="group" aria-label="Language / Idioma">
  @for (language of languages; track language) {
    <button
      type="button"
      [attr.aria-pressed]="currentLang() === language"
      (click)="useLanguage(language)"
    >
      {{ language.toUpperCase() }}
    </button>
  }
</div>
